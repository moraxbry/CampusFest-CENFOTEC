<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CampusFest — Detalle de Actividad</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="detail">
  <div id="navbar-placeholder"></div>

  <main id="main-content" class="container py-5" style="max-width: 720px;">
    <a href="/catalog.html" class="btn btn-link px-0 mb-3"><i aria-hidden="true" class="bi bi-arrow-left"></i> Volver al catálogo</a>
    <div id="activityDetail">
      <p class="text-muted">Cargando actividad…</p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Modal de inscripción -->
  <div class="modal fade" id="inscriptionModal" tabindex="-1" aria-hidden="true" aria-labelledby="inscriptionModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inscriptionModalLabel">Inscripción a Actividad</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <h6 id="inscriptionModalActivityName" class="text-primary"></h6>
          <div id="inscriptionAlert"></div>
          <form id="inscriptionForm" novalidate>
            <input type="hidden" name="activity">
            <div class="mb-3">
              <label class="form-label" for="fullName">Nombre Completo</label>
              <input class="form-control" id="fullName" name="fullName" type="text">
              <div class="invalid-feedback">Este campo es obligatorio.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="idNumber">Identificación</label>
              <input class="form-control" id="idNumber" name="idNumber" type="text">
              <div class="invalid-feedback">Este campo es obligatorio.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="phone">Teléfono</label>
              <input class="form-control" id="phone" name="phone" type="tel">
              <div class="invalid-feedback">Este campo es obligatorio.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Correo Electrónico</label>
              <input class="form-control" id="email" name="email" type="email">
              <div class="invalid-feedback">Ingresá un correo válido.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="major">Carrera o Grupo</label>
              <input class="form-control" id="major" name="major" type="text">
              <div class="invalid-feedback">Este campo es obligatorio.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="comments">Comentarios (Opcional)</label>
              <textarea class="form-control" id="comments" name="comments" rows="2"></textarea>
            </div>
            <div class="modal-footer px-0 pb-0">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Inscribirme</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validator.js"></script>
  <script src="/js/filters.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
