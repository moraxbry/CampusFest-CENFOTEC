<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CampusFest — Stands</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="stands">
  <div id="navbar-placeholder"></div>

  <main id="main-content" class="container py-5">
    <h1>Stands y Proyectos Participantes</h1>
    <p class="text-muted">Descubre los proyectos innovadores desarrollados por nuestros estudiantes.</p>

    <div class="row g-2 mb-4">
      <div class="col-md-8">
        <input type="text" class="form-control" id="standSearchInput" placeholder="Buscar por nombre, descripción o encargado...">
      </div>
      <div class="col-md-4">
        <select class="form-select" id="standCategoryFilter">
          <option value="Todas">Todas las categorías</option>
        </select>
      </div>
    </div>

    <div class="alert alert-info d-none" id="standsEmpty">
      No se encontraron stands con esos filtros.
      <button type="button" class="btn btn-link btn-sm p-0 ms-1" id="clearStandFiltersBtn">Limpiar filtros</button>
    </div>

    <div class="row" id="standsGrid">
      <div class="col-12 text-center text-muted py-4">Cargando stands…</div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validator.js"></script>
  <script src="/js/filters.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
