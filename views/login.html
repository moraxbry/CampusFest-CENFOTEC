<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CampusFest — Ingreso al Sistema</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
  <div id="navbar-placeholder"></div>

  <main id="main-content" class="container py-5 d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
      <div class="card-body p-4">
        <h2 class="text-center mb-1"><i aria-hidden="true" class="bi bi-shield-lock"></i> Ingreso al Sistema</h2>
        <p class="text-muted text-center small mb-4">Simulador de inicio de sesión para el prototipo</p>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="email">Correo Electrónico</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="admin@campusfest.com">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar como Administrador</button>
        </form>

        <div class="text-center mt-3">
          <a href="/home.html" class="small">Volver al Inicio</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validator.js"></script>
  <script src="/js/filters.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
